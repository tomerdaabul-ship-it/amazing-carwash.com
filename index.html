<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>האחים מכונית בע"מ 🚗💦🧽</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #f5f5f5;
      background-color: #000;
      background-image:
        linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)),
        url("images/mercedes-amg-gt-r-night-racing-track-1920x1080-97.jpg");
      background-position: center;
      background-size: cover;
      background-attachment: fixed;
    }

    header {
      position: relative;
      padding: 70px 20px;
      text-align: center;
    }

    header h1 {
      font-size: 44px;
      letter-spacing: 1px;
      text-shadow: 0 6px 18px rgba(0,0,0,0.9);
      margin: 0;
    }

    header p {
      margin-top: 10px;
      font-weight: bold;
      opacity: 0.9;
    }

    .team-note {
      position: absolute;
      left: 20px;
      top: 20px;
      font-weight: bold;
    }

    /* 🔥 LEVEL A TRANSPARENT GLASS SECTIONS */
    section {
      background: rgba(255,255,255,0.70);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);

      color: #111;
      max-width: 900px;
      margin: 20px auto;
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 12px 35px rgba(0,0,0,0.45);
    }

    h2 { color: #0a74da; }

    ul { line-height: 1.8; }

    input, select, textarea {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border-radius: 6px;
      border: 1px solid #ccc;
      box-sizing: border-box;
      background: rgba(255,255,255,0.85);
    }

    button {
      background: linear-gradient(135deg, #0a74da, #003f8f);
      color: white;
      border: none;
      padding: 12px;
      width: 100%;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: transform .15s ease, box-shadow .15s ease;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 18px rgba(0,0,0,0.4);
    }

    .rating-box {
      position: fixed;
      right: 20px;
      top: 140px;
      width: 230px;
      background: rgba(255,255,255,0.75);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      color: #111;
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.4);
      z-index: 999;
    }

    .stars span {
      filter: grayscale(100%);
      cursor: pointer;
      font-size: 22px;
    }

    .stars span.active { filter: grayscale(0%); }

    .status {
      margin-top: 10px;
      font-weight: bold;
      color: #0a74da;
    }

    @media (max-width: 980px) {
      .rating-box {
        position: static;
        width: auto;
        max-width: 900px;
        margin: 10px auto;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="team-note">👥 אנחנו 4 אנשים בעסק</div>
  <h1>האחים מכונית בע"מ 🚗💦🧽</h1>
  <p>(יהיו ימי שישי שלא תתקיים שטיפה בשל סיבות פרטיות)</p>
</header>

<div class="rating-box">
  <h3>דרגו אותנו ⭐</h3>
  <div class="stars" id="stars">
    <span>⭐</span><span>⭐</span><span>⭐</span><span>⭐</span><span>⭐</span>
  </div>
  <input type="text" id="reviewName" placeholder="השם שלכם" />
  <textarea id="feedback" placeholder="כתבו משוב קצר..."></textarea>
  <button type="button" onclick="sendFeedback()">שלח משוב</button>
  <hr>
  <div id="reviewsList"></div>
</div>

<section>
  <h2>מחירים</h2>
  <ul>
    <li>🚗 פנים + חוץ – 60 ₪</li>
    <li>🚿 חוץ בלבד – 25 ₪</li>
    <li>🧼 פנים בלבד – 35 ₪</li>
  </ul>
</section>

<section>
  <h2>הזמנת שטיפה</h2>
  <form onsubmit="bookAndWhatsApp(event)">
    <label>שם מלא</label>
    <input id="name" required />

    <label>טלפון</label>
    <input id="phone" type="tel" required />

    <label>סוג שטיפה</label>
    <select id="service">
      <option>פנים וחוץ – 60 ₪</option>
      <option>חוץ בלבד – 25 ₪</option>
      <option>פנים בלבד – 35 ₪</option>
    </select>

    <label>תאריך (שישי בלבד)</label>
    <input id="date" type="date" required onchange="refreshTimes()" />

    <label>שעה פנויה</label>
    <select id="time">
      <option>בחר תאריך קודם...</option>
    </select>

    <button type="submit" id="submitBtn">
      קבע תור + שלח בוואטסאפ
    </button>

    <div id="bookingStatus" class="status"></div>
  </form>
</section>

<script>
  const CAL_API_URL = "https://script.google.com/macros/s//AKfycbwsDXP-PLqwp82wWwm1Wk-iPJgJ-n8uttfx-Y_TF2e3VUbH_toEXUKTgTCs6eLORt4P/exec";
  const CAL_TOKEN = "X9mP2qL8vR4nK7jW3yB5tH6dC1sF0gZ2xM8bV4lQ";

  function jsonpRequest(params) {
    return new Promise(resolve => {
      const cb = "cb_" + Math.random().toString(36).slice(2);
      params.prefix = cb;
      params.token = CAL_TOKEN;

      const script = document.createElement("script");
      script.src = CAL_API_URL + "?" + new URLSearchParams(params);

      window[cb] = data => {
        resolve(data);
        delete window[cb];
        script.remove();
      };

      document.body.appendChild(script);
    });
  }

  async function refreshTimes() {
    const date = document.getElementById("date").value;
    const timeSelect = document.getElementById("time");

    if (new Date(date).getDay() !== 5) {
      alert("ניתן להזמין רק ביום שישי");
      document.getElementById("date").value = "";
      return;
    }

    timeSelect.innerHTML = "<option>טוען...</option>";
    const res = await jsonpRequest({ action: "busy", date });
    const busy = res.busy || [];

    timeSelect.innerHTML = "";
    for (let h = 9; h <= 14; h++) {
      for (let m of ["00", "35"]) {
        if (h === 14 && m === "35") continue;
        const t = `${String(h).padStart(2,'0')}:${m}`;
        const opt = document.createElement("option");
        opt.value = t;
        opt.textContent = busy.includes(t) ? `${t} (תפוס)` : t;
        opt.disabled = busy.includes(t);
        timeSelect.appendChild(opt);
      }
    }
  }

  async function bookAndWhatsApp(e) {
    e.preventDefault();
    document.getElementById("bookingStatus").textContent = "רושם ביומן...";

    const name = document.getElementById("name").value;
    const service = document.getElementById("service").value;
    const date = document.getElementById("date").value;
    const time = document.getElementById("time").value;

    const res = await jsonpRequest({
      action: "book",
      name,
      service,
      date,
      time
    });

    if (res.ok) {
      const msg =
        `שלום,\nנקבע תור לשטיפת רכב 🚗\n\n` +
        `שם: ${name}\n` +
        `סוג שטיפה: ${service}\n` +
        `תאריך: ${date}\n` +
        `שעה: ${time}`;

      window.location.href =
        `https://wa.me/972585378542?text=` +
        encodeURIComponent(msg);
    } else {
      alert("שגיאה בקביעת התור");
    }
  }

  /* Reviews */
  let rating = 0;
  const stars = document.querySelectorAll('#stars span');
  stars.forEach((s,i)=>s.onclick=()=>{
    rating=i+1;
    stars.forEach((st,idx)=>st.classList.toggle('active',idx<rating));
  });

  function sendFeedback() {
    const name=document.getElementById('reviewName').value||'אנונימי';
    const text=document.getElementById('feedback').value;
    if(!rating||!text) return alert("אנא דרגו");
    let r=JSON.parse(localStorage.getItem('reviews')||'[]');
    r.unshift({name,rating,text});
    localStorage.setItem('reviews',JSON.stringify(r.slice(0,5)));
    location.reload();
  }

  (function(){
    const r=JSON.parse(localStorage.getItem('reviews')||'[]');
    document.getElementById('reviewsList').innerHTML=
      r.map(x=>`<div><b>${x.name}</b> (${'⭐'.repeat(x.rating)})<br>${x.text}</div>`).join('')
      || "אין חוות דעת";
  })();
</script>

</body>
</html>
