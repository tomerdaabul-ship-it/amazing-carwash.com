<script>
  // --- CONFIGURATION ---
  const CAL_API_URL = "https://script.google.com/macros/s/AKfycbwsDXP-PLqwp82wWwm1Wk-iPJgJ-n8uttfx-Y_TF2e3VUbH_toEXUKTgTCs6eLORt4P/exec"; 
  const CAL_TOKEN = "X9mP2qL8vR4nK7jW3yB5tH6dC1sF0gZ2xM8bV4lQ";
  const SLOT_MINUTES = 35;

  // --- CALENDAR LOGIC ---
  async function jsonpRequest(params) {
    return new Promise((resolve) => {
      const cb = "cb_" + Math.random().toString(36).slice(2);
      params.prefix = cb;
      const url = `${CAL_API_URL}?${new URLSearchParams(params).toString()}`;
      const script = document.createElement("script");
      
      window[cb] = (data) => {
        delete window[cb];
        if (script.parentNode) script.parentNode.removeChild(script);
        resolve(data);
      };

      script.onerror = () => {
        console.error("Connection Error");
        resolve({ok: false, error: "Network error"});
      };

      document.body.appendChild(script);
    });
  }

  const dateInput = document.getElementById("date");
  const timeSelect = document.getElementById("time");

  // Set default date
  const today = new Date();
  const nextFriday = new Date();
  nextFriday.setDate(today.getDate() + (5 - today.getDay() + 7) % 7);
  dateInput.value = nextFriday.toISOString().split('T')[0];

  async function refreshTimes() {
    timeSelect.innerHTML = "<option>בודק שעות פנויות...</option>";
    try {
        const resp = await jsonpRequest({ token: CAL_TOKEN, action: "busy", date: dateInput.value });
        const busy = resp.busy || [];
        timeSelect.innerHTML = "";
        
        for (let m = 9*60; m < 14.5*60; m += SLOT_MINUTES) {
          const t = `${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
          const opt = document.createElement("option");
          opt.value = t;
          opt.textContent = t + (busy.includes(t) ? " (תפוס)" : "");
          opt.disabled = busy.includes(t);
          timeSelect.appendChild(opt);
        }
    } catch (e) {
        timeSelect.innerHTML = "<option>שגיאה בטעינה</option>";
    }
  }

  dateInput.addEventListener("change", refreshTimes);
  refreshTimes();

  async function bookAndWhatsApp(e) {
    e.preventDefault();
    const name = document.getElementById("name").value;
    const phone = document.getElementById("phone").value;
    const time = timeSelect.value;
    const btn = document.getElementById("submitBtn");
    
    btn.disabled = true;
    document.getElementById("bookingStatus").textContent = "רושם ביומן...";

    try {
        const resp = await jsonpRequest({
          token: CAL_TOKEN, action: "book", name: name, phone: phone, 
          date: dateInput.value, time: time, duration: SLOT_MINUTES
        });

        if (resp.ok) {
          const msg = `הזמנה חדשה:%0Aשם: ${name}%0Aתאריך: ${dateInput.value}%0Aשעה: ${time}`;
          window.location.href = `https://wa.me/972585378542?text=${msg}`;
        } else {
          alert("שגיאה: התור כבר נתפס.");
          refreshTimes();
        }
    } catch (e) {
        alert("שגיאה בחיבור לשרת.");
    } finally {
      btn.disabled = false;
      document.getElementById("bookingStatus").textContent = "";
    }
  }

  // Feedback Logic
  let rating = 0;
  const stars = document.querySelectorAll('#stars span');
  stars.forEach((s, i) => s.onclick = () => {
    rating = i + 1;
    stars.forEach((st, idx) => st.classList.toggle('active', idx < rating));
  });

  window.sendFeedback = function() {
    const name = document.getElementById('reviewName').value || 'אנונימי';
    const text = document.getElementById('feedback').value;
    if (!rating || !text) return alert("אנא דרגו בכוכבים וכתבו משוב");
    let reviews = JSON.parse(localStorage.getItem('reviews') || '[]');
    reviews.unshift({ name, rating, text });
    localStorage.setItem('reviews', JSON.stringify(reviews.slice(0, 5)));
    location.reload();
  };

  (function loadReviews() {
    const reviews = JSON.parse(localStorage.getItem('reviews') || '[]');
    const list = document.getElementById('reviewsList');
    if (list) {
       list.innerHTML = reviews.map(r => `
         <div class="review"><b>${r.name}</b> (${'⭐'.repeat(r.rating)})<br>${r.text}</div>
       `).join('') || "אין חוות דעת עדיין";
    }
  })();
</script>
