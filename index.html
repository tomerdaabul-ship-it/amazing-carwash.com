<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>האחים מכונית בע"מ 🚗💦🧽</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #f5f5f5;
      background-color: #000;
      background-image:
        linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)),
        url("images/mercedes-amg-gt-r-night-racing-track-1920x1080-97.jpg");
      background-position: center;
      background-size: cover;
      background-attachment: fixed;
    }

    header {
      padding: 70px 20px;
      text-align: center;
    }

    header h1 {
      font-size: 42px;
      text-shadow: 0 6px 18px rgba(0,0,0,0.9);
    }

    section {
      background: rgba(255,255,255,0.70);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      color: #111;
      max-width: 900px;
      margin: 20px auto;
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 12px 35px rgba(0,0,0,0.45);
    }

    input, select, textarea {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border-radius: 6px;
      border: 1px solid #ccc;
      background: rgba(255,255,255,0.85);
    }

    button {
      background: linear-gradient(135deg, #0a74da, #003f8f);
      color: white;
      border: none;
      padding: 12px;
      width: 100%;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .status {
      margin-top: 10px;
      font-weight: bold;
      color: #0a74da;
    }
  </style>
</head>

<body>

<header>
  <h1>האחים מכונית בע"מ 🚗💦🧽</h1>
  <p>(ימי שישי בלבד)</p>
</header>

<section>
  <h2>הזמנת שטיפה</h2>
  <form onsubmit="bookAndWhatsApp(event)">
    <label>שם מלא</label>
    <input id="name" required />

    <label>טלפון</label>
    <input id="phone" type="tel" required />

    <label>סוג שטיפה</label>
    <select id="service">
      <option>פנים וחוץ – 60 ₪</option>
      <option>חוץ בלבד – 25 ₪</option>
      <option>פנים בלבד – 35 ₪</option>
    </select>

    <label>תאריך (שישי בלבד)</label>
    <input
      id="date"
      type="date"
      required
      onchange="refreshTimes()"
      oninput="refreshTimes()"
      onblur="refreshTimes()"
    />

    <label>שעה פנויה</label>
    <select id="time">
      <option>בחר תאריך קודם...</option>
    </select>

    <button type="submit">קבע תור + שלח בוואטסאפ</button>
    <div id="bookingStatus" class="status"></div>
  </form>
</section>

<script>
  const CAL_API_URL =
    "https://script.google.com/macros/s//AKfycbwsDXP-PLqwp82wWwm1Wk-iPJgJ-n8uttfx-Y_TF2e3VUbH_toEXUKTgTCs6eLORt4P/exec";
  const CAL_TOKEN =
    "X9mP2qL8vR4nK7jW3yB5tH6dC1sF0gZ2xM8bV4lQ";

  function jsonpRequest(params) {
    return new Promise(resolve => {
      const cb = "cb_" + Date.now() + "_" + Math.random().toString(36).slice(2);

      params.prefix = cb;
      params.token = CAL_TOKEN;
      params._ts = Date.now(); // iOS cache-buster

      const script = document.createElement("script");
      script.src = CAL_API_URL + "?" + new URLSearchParams(params);

      window[cb] = data => {
        resolve(data);
        delete window[cb];
        script.remove();
      };

      script.onerror = () => {
        resolve({ ok: false });
        delete window[cb];
        script.remove();
      };

      document.body.appendChild(script);
    });
  }

  async function refreshTimes() {
    const dateStr = document.getElementById("date").value;
    const timeSelect = document.getElementById("time");

    if (!dateStr) return;

    // ✅ iOS-safe date parsing
    const parts = dateStr.split("-");
    const localDate = new Date(
      Number(parts[0]),
      Number(parts[1]) - 1,
      Number(parts[2])
    );

    if (localDate.getDay() !== 5) {
      alert("ניתן להזמין רק ביום שישי");
      document.getElementById("date").value = "";
      timeSelect.innerHTML = "<option>בחר תאריך קודם...</option>";
      return;
    }

    timeSelect.innerHTML = "<option>טוען...</option>";

    const res = await jsonpRequest({
      action: "busy",
      date: dateStr
    });

    const busy = res.busy || [];
    timeSelect.innerHTML = "";

    for (let h = 9; h <= 14; h++) {
      for (let m of ["00", "35"]) {
        if (h === 14 && m === "35") continue;
        const t = `${String(h).padStart(2,"0")}:${m}`;
        const opt = document.createElement("option");
        opt.value = t;
        opt.textContent = busy.includes(t) ? `${t} (תפוס)` : t;
        opt.disabled = busy.includes(t);
        timeSelect.appendChild(opt);
      }
    }
  }

  async function bookAndWhatsApp(e) {
    e.preventDefault();
    document.getElementById("bookingStatus").textContent = "רושם ביומן...";

    const name = document.getElementById("name").value;
    const service = document.getElementById("service").value;
    const date = document.getElementById("date").value;
    const time = document.getElementById("time").value;

    const res = await jsonpRequest({
      action: "book",
      name,
      service,
      date,
      time
    });

    if (res.ok) {
      const msg =
        `שלום,\nנקבע תור לשטיפת רכב 🚗\n\n` +
        `שם: ${name}\n` +
        `סוג שטיפה: ${service}\n` +
        `תאריך: ${date}\n` +
        `שעה: ${time}`;

      window.location.href =
        `https://wa.me/972585378542?text=` +
        encodeURIComponent(msg);
    } else {
      alert("שגיאה בקביעת התור");
    }
  }
</script>

</body>
</html>
