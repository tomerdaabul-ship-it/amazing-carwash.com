<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>האחים מכונית בע"מ 🚗</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #e8f2ff;
      margin: 0;
      padding: 20px;
    }
    section {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    h1, h2 { color: #0a74da; text-align: center; }
    label { display: block; margin-top: 12px; }
    input, select, button {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border-radius: 6px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }
    button {
      background: #0a74da;
      color: white;
      border: none;
      font-size: 16px;
      cursor: pointer;
      margin-top: 16px;
    }
    button:disabled { background: #aaa; }
    .status { margin-top: 12px; font-weight: bold; color: #0a74da; text-align: center; }
  </style>
</head>

<body>

<section>
  <h1>האחים מכונית 🚗</h1>
  <h2>קביעת תור לשטיפה</h2>

  <form onsubmit="book(event)">
    <label>שם מלא</label>
    <input id="name" required>

    <label>תאריך (שישי בלבד)</label>
    <input id="date" type="date" required onchange="loadTimes()">

    <label>שעה פנויה</label>
    <select id="time">
      <option>בחר תאריך...</option>
    </select>

    <button id="btn" type="submit">קבע תור</button>
    <div id="status" class="status"></div>
  </form>
</section>

<script>
  /* ================= CONFIG ================= */

  const CAL_API_URL = "https://script.google.com/macros/s//AKfycbwsDXP-PLqwp82wWwm1Wk-iPJgJ-n8uttfx-Y_TF2e3VUbH_toEXUKTgTCs6eLORt4P/exec";
  const CAL_TOKEN = "X9mP2qL8vR4nK7jW3yB5tH6dC1sF0gZ2xM8bV4lQ";

  /* ============== JSONP CORE ================ */

  function jsonp(params) {
    return new Promise(resolve => {
      const cb = "cb_" + Math.random().toString(36).slice(2);
      params.prefix = cb;
      params.token = CAL_TOKEN;
      params.origin = location.origin;

      const url = CAL_API_URL + "?" + new URLSearchParams(params);
      const script = document.createElement("script");

      window[cb] = data => {
        resolve(data);
        delete window[cb];
        script.remove();
      };

      script.onerror = () => {
        resolve({ ok: false });
        script.remove();
      };

      script.src = url;
      document.body.appendChild(script);
    });
  }

  /* ============ LOAD AVAILABLE TIMES ========= */

  async function loadTimes() {
    const date = document.getElementById("date").value;
    const timeSel = document.getElementById("time");

    if (!date) return;

    if (new Date(date).getDay() !== 5) {
      alert("ניתן להזמין רק ביום שישי");
      document.getElementById("date").value = "";
      return;
    }

    timeSel.innerHTML = "<option>טוען...</option>";

    const res = await jsonp({ action: "busy", date });
    const busy = res.busy || [];

    timeSel.innerHTML = "";
    for (let h = 9; h <= 14; h++) {
      for (let m of ["00", "35"]) {
        if (h === 14 && m === "35") continue;
        const t = `${String(h).padStart(2,"0")}:${m}`;

        const opt = document.createElement("option");
        opt.value = t;
        opt.textContent = busy.includes(t) ? `${t} (תפוס)` : t;
        opt.disabled = busy.includes(t);

        timeSel.appendChild(opt);
      }
    }
  }

  /* ================ BOOK SLOT ================ */

  async function book(e) {
    e.preventDefault();

    const name = document.getElementById("name").value;
    const date = document.getElementById("date").value;
    const time = document.getElementById("time").value;
    const status = document.getElementById("status");
    const btn = document.getElementById("btn");

    btn.disabled = true;
    status.textContent = "רושם ביומן...";

    const res = await jsonp({
      action: "book",
      name,
      date,
      time
    });

    if (res.ok) {
      status.textContent = "התור נקבע בהצלחה ✅";
    } else {
      status.textContent = "שגיאה, נסו שוב";
      btn.disabled = false;
    }
  }
</script>

</body>
</html>
