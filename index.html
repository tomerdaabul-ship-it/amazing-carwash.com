<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>האחים מכונית בע"מ</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #111;
  color: #fff;
  padding: 20px;
}
section {
  background: rgba(255,255,255,0.9);
  color: #000;
  padding: 20px;
  border-radius: 12px;
}
button {
  width: 100%;
  padding: 15px;
  margin-top: 15px;
  font-size: 16px;
}
</style>
</head>

<body>

<section>
<label>שם</label>
<input id="name">

<label>סוג שטיפה</label>
<select id="service">
  <option>פנים וחוץ</option>
  <option>חוץ בלבד</option>
  <option>פנים בלבד</option>
</select>

<label>תאריך</label>
<input id="date" type="date">

<button onclick="loadHours()">טען שעות</button>

<select id="time"></select>

<button onclick="book()">קבע תור + וואטסאפ</button>
</section>

<script>
const CAL_API_URL = "https://script.google.com/macros/s/AKfycbyMSFmXoKgQ4jXoMKFJ1E1icx_Rdo3YHrOWqOJfTa_BDSVu2TUPYYfaaMn0c24a-NYZ/exec";
const CAL_TOKEN = "X9mP2qL8vR4nK7jW3yB5tH6dC1sF0gZ2xM8bV4lQ";

function jsonp(params) {
  return new Promise(resolve => {
    const cb = "cb_" + Math.random().toString(36).slice(2);
    params.prefix = cb;
    const s = document.createElement("script");
    s.src = CAL_API_URL + "?" + new URLSearchParams(params);
    window[cb] = data => {
      resolve(data);
      delete window[cb];
      s.remove();
    };
    document.body.appendChild(s);
  });
}

async function loadHours() {
  alert("Loading hours"); // DEBUG – proves click works
  const date = document.getElementById("date").value;
  const timeSel = document.getElementById("time");
  const r = await jsonp({ action: "busy", date });
  timeSel.innerHTML = "";
  (r.busy || []).forEach(t => {
    const o = document.createElement("option");
    o.textContent = t;
    o.value = t;
    timeSel.appendChild(o);
  });
}

async function book() {
  alert("Booking click works"); // DEBUG
  const name = document.getElementById("name").value;
  const service = document.getElementById("service").value;
  const date = document.getElementById("date").value;
  const time = document.getElementById("time").value;

  const r = await jsonp({
    action: "book",
    token: CAL_TOKEN,
    name, service, date, time
  });

  if (!r.ok) {
    alert("Booking failed");
    return;
  }

  const msg = `נקבע תור:\n${name}\n${service}\n${date} ${time}`;
  window.location.href =
    "https://wa.me/972585378542?text=" + encodeURIComponent(msg);
}
</script>

</body>
</html>
