<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<title>האחים מכונית בע"מ 🚗💦🧽</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:
    linear-gradient(rgba(0,0,0,.65),rgba(0,0,0,.65)),
    url("images/mercedes-amg-gt-r-night-racing-track-1920x1080-97.jpg")
    center/cover fixed no-repeat;
  color:#fff;
}
header{text-align:center;padding:70px 20px}
section{
  background:rgba(255,255,255,.72);
  color:#111;
  max-width:900px;
  margin:20px auto;
  padding:20px;
  border-radius:14px;
}
input,select,textarea{
  width:100%;
  padding:8px;
  margin-top:5px;
  border-radius:6px;
  border:1px solid #ccc;
  background:rgba(255,255,255,.85);
}
button{
  background:#0a74da;
  color:#fff;
  border:none;
  padding:12px;
  width:100%;
  border-radius:10px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  margin-top:10px;
}
.rating-box{
  position:fixed;
  right:20px;
  top:140px;
  width:240px;
  background:rgba(255,255,255,.8);
  color:#111;
  padding:12px;
  border-radius:12px;
}
.stars span{cursor:pointer;font-size:22px;filter:grayscale(100%)}
.stars span.active{filter:grayscale(0%)}
@media(max-width:900px){
  .rating-box{position:static;margin:10px auto}
}
</style>
</head>

<body>

<header>
  <h1>האחים מכונית בע"מ 🚗💦🧽</h1>
  <p>(הזמנות בימי שישי בלבד)</p>
</header>

<!-- ⭐ Reviews -->
<div class="rating-box">
  <h3>דרגו אותנו ⭐</h3>
  <div class="stars" id="stars">
    <span>⭐</span><span>⭐</span><span>⭐</span><span>⭐</span><span>⭐</span>
  </div>
  <input id="reviewName" placeholder="השם שלכם">
  <textarea id="feedback" placeholder="כתבו חוות דעת..."></textarea>
  <button type="button" onclick="sendFeedback()">שלח</button>
  <div id="reviewsList"></div>
</div>

<section>
<h2>הזמנת שטיפה</h2>

<form onsubmit="bookAndWhatsApp(event)">
<label>שם מלא</label>
<input id="name" required>

<label>טלפון</label>
<input id="phone" required>

<label>סוג שטיפה</label>
<select id="service">
<option>פנים וחוץ – 60 ₪</option>
<option>חוץ בלבד – 25 ₪</option>
<option>פנים בלבד – 35 ₪</option>
</select>

<label>תאריך (שישי בלבד)</label>
<input id="date" type="date" required step="7">

<button type="button" onclick="refreshTimes()">הצג שעות פנויות</button>

<label>שעה פנויה</label>
<select id="time">
<option>בחר תאריך קודם...</option>
</select>

<button type="submit">קבע תור + שלח בוואטסאפ</button>
</form>
</section>
  <script>
const CAL_API_URL="https://script.google.com/macros/s/AKfycbwwyzZwnv_vVe3vcgVat7i6oY9mL1SH9aV2SbbjM_e_A9WhClOg2l6C7zfU9OPaywyF/exec";
const CAL_TOKEN="X9mP2qL8vR4nK7jW3yB5tH6dC1sF0gZ2xM8bV4lQ";

/* Fridays only */
(function(){
  const d=document.getElementById("date");
  const t=new Date();
  const diff=(5-t.getDay()+7)%7||7;
  t.setDate(t.getDate()+diff);
  d.min=t.toISOString().slice(0,10);
})();

/* JSONP busy slots ONLY */
function jsonpRequest(params){
  return new Promise(resolve=>{
    const cb="cb_"+Math.random().toString(36).slice(2);
    params.prefix=cb;
    const s=document.createElement("script");
    s.src=CAL_API_URL+"?"+new URLSearchParams(params);
    window[cb]=d=>{resolve(d);delete window[cb];s.remove();}
    document.body.appendChild(s);
  });
}

async function refreshTimes(){
  const date=document.getElementById("date").value;
  const time=document.getElementById("time");
  if(!date)return;
  time.innerHTML="<option>טוען...</option>";
  const r=await jsonpRequest({action:"busy",date});
  const busy=r.busy||[];
  time.innerHTML="";
  for(let h=9;h<=14;h++){
    for(let m of["00","35"]){
      if(h===14&&m==="35")continue;
      const t=`${String(h).padStart(2,"0")}:${m}`;
      const o=document.createElement("option");
      o.value=t;
      o.textContent=busy.includes(t)?`${t} (תפוס)`:t;
      o.disabled=busy.includes(t);
      time.appendChild(o);
    }
  }
}

/* 🔥 ONLY booking path (NO JSON, NO FETCH) */
function bookAndWhatsApp(e){
  e.preventDefault();
  const params=new URLSearchParams({
    action:"book",
    token:CAL_TOKEN,
    name:name.value,
    service:service.value,
    date:date.value,
    time:time.value
  });
  window.location.href=CAL_API_URL+"?"+params.toString();
}

/* Reviews */
let rating=0;
document.querySelectorAll("#stars span").forEach((s,i)=>{
  s.onclick=()=>{
    rating=i+1;
    document.querySelectorAll("#stars span").forEach((st,j)=>st.classList.toggle("active",j<rating));
  }
});
function sendFeedback(){
  if(!rating||!feedback.value)return alert("אנא דרגו");
  const r=JSON.parse(localStorage.getItem("reviews")||"[]");
  r.unshift({n:reviewName.value||"אנונימי",r:rating,t:feedback.value});
  localStorage.setItem("reviews",JSON.stringify(r.slice(0,5)));
  location.reload();
}
(function(){
  const r=JSON.parse(localStorage.getItem("reviews")||"[]");
  reviewsList.innerHTML=r.map(x=>`<div><b>${x.n}</b> (${ "⭐".repeat(x.r) })<br>${x.t}</div>`).join("")||"אין חוות דעת";
})();
</script>

</body>
</html>
