<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>האחים מכונית בע"מ 🚗💦🧽</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:
    linear-gradient(rgba(0,0,0,.65),rgba(0,0,0,.65)),
    url("images/mercedes-amg-gt-r-night-racing-track-1920x1080-97.jpg")
    center/cover fixed no-repeat;
  color:#fff;
}
header{text-align:center;padding:70px 20px}
section{
  background:rgba(255,255,255,.8);
  color:#111;
  max-width:900px;
  margin:20px auto;
  padding:20px;
  border-radius:14px;
}
label{font-weight:bold;display:block;margin-top:12px}
input,select{
  width:100%;
  padding:10px;
  margin-top:6px;
  border-radius:6px;
  border:1px solid #ccc;
}
button{
  background:#0a74da;
  color:#fff;
  border:none;
  padding:14px;
  width:100%;
  border-radius:10px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  margin-top:14px;
}
#hours{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(80px,1fr));
  gap:10px;
  margin-top:10px;
}
.hour-btn{
  padding:10px;
  border-radius:8px;
  border:1px solid #0a74da;
  background:#fff;
  color:#0a74da;
  font-weight:bold;
  cursor:pointer;
}
.hour-btn.active{
  background:#0a74da;
  color:#fff;
}
.hour-btn.disabled{
  opacity:.4;
  cursor:not-allowed;
}
.status{margin-top:10px;font-weight:bold;color:#0a74da}
</style>
</head>

<body>

<header>
  <h1>האחים מכונית בע"מ 🚗💦🧽</h1>
  <p>(הזמנות בימי שישי בלבד)</p>
</header>

<section>
<h2>הזמנת שטיפה</h2>

<label>שם מלא</label>
<input id="name">

<label>טלפון</label>
<input id="phone">

<label>סוג שטיפה</label>
<select id="service">
  <option>פנים וחוץ – 60 ₪</option>
  <option>חוץ בלבד – 25 ₪</option>
  <option>פנים בלבד – 35 ₪</option>
</select>

<label>תאריך (שישי בלבד)</label>
<input id="date" type="date" onchange="onDateChange()">

<button type="button" onclick="loadTimes()">הצג שעות פנויות</button>

<label>בחר שעה</label>
<div id="hours"></div>

<button type="button" onclick="bookAndWhatsApp()">קבע תור + שלח בוואטסאפ</button>

<div id="status" class="status"></div>
</section>

<script>
const CAL_API_URL =
  "https://script.google.com/macros/s/AKfycbyMSFmXoKgQ4jXoMKFJ1E1icx_Rdo3YHrOWqOJfTa_BDSVu2TUPYYfaaMn0c24a-NYZ/exec";
const CAL_TOKEN =
  "X9mP2qL8vR4nK7jW3yB5tH6dC1sF0gZ2xM8bV4lQ";

let selectedTime = "";
let bookingInProgress = false;

/* Fridays only */
(() => {
  const d=document.getElementById("date");
  const t=new Date();
  const diff=(5-t.getDay()+7)%7||7;
  t.setDate(t.getDate()+diff);
  d.min=t.toISOString().slice(0,10);
})();

function jsonpRequest(params){
  return new Promise(resolve=>{
    const cb="cb_"+Math.random().toString(36).slice(2);
    params.prefix=cb;
    const s=document.createElement("script");
    s.src=CAL_API_URL+"?"+new URLSearchParams(params);
    window[cb]=d=>{resolve(d);delete window[cb];s.remove();}
    document.body.appendChild(s);
  });
}

/* 🔥 Android-safe date commit */
function onDateChange(){
  // slight delay lets Android commit the value
  setTimeout(loadTimes, 50);
}

async function loadTimes(){
  const date=document.getElementById("date").value;
  const box=document.getElementById("hours");
  box.innerHTML="";
  selectedTime="";

  if(!date){
    box.textContent="נא לבחור תאריך";
    return;
  }

  box.textContent="טוען...";

  const r=await jsonpRequest({action:"busy",date});
  const busy=r.busy||[];

  box.innerHTML="";
  for(let h=9;h<=14;h++){
    for(const m of["00","35"]){
      if(h===14&&m==="35")continue;
      const t=`${String(h).padStart(2,"0")}:${m}`;
      const b=document.createElement("div");
      b.textContent=t;
      b.className="hour-btn"+(busy.includes(t)?" disabled":"");
      if(!busy.includes(t)){
        b.onclick=()=>{
          document.querySelectorAll(".hour-btn")
            .forEach(x=>x.classList.remove("active"));
          b.classList.add("active");
          selectedTime=t;
        };
      }
      box.appendChild(b);
    }
  }
}

async function bookAndWhatsApp(){
  if(bookingInProgress) return;
  bookingInProgress=true;

  const status=document.getElementById("status");

  if(!selectedTime){
    status.textContent="נא לבחור שעה";
    bookingInProgress=false;
    return;
  }

  status.textContent="שומר תור...";

  const name=document.getElementById("name").value;
  const phone=document.getElementById("phone").value;
  const service=document.getElementById("service").value;
  const date=document.getElementById("date").value;

  const r=await jsonpRequest({
    action:"book",
    token:CAL_TOKEN,
    name,phone,service,date,time:selectedTime
  });

  if(!r||!r.ok){
    status.textContent="שגיאה";
    bookingInProgress=false;
    return;
  }

  const msg=
    `שלום,\nנקבע תור לשטיפת רכב 🚗\n\n`+
    `שם: ${name}\nטלפון: ${phone}\n`+
    `סוג: ${service}\nתאריך: ${date}\nשעה: ${selectedTime}`;

  window.location.href=
    "https://wa.me/972585378542?text="+encodeURIComponent(msg);
}
</script>

</body>
</html>
